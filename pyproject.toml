[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sheets-fidelity"
version = "0.1.0"
description = "Python helpers and Claude Code skills for editing Google Sheets without losing formulas, merges or formatting."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Oliver Schwartz" }]
keywords = ["google-sheets", "sheets-api", "gspread", "round-trip", "formatting", "spreadsheets"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = ["gspread>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/o-liverschwartz/sheets-fidelity"
Issues = "https://github.com/o-liverschwartz/sheets-fidelity/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
